<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세계 분쟁 지역 지도 (학습 자료)</title>
<style>
:root{
  --bg:#0c1118; --bg2:#131b25; --bg3:#1c2733; --line:#3a4c62;
  --ink:#f4f8fc; --ink2:#cdd8e4; --accent:#ffd84d; --ok:#5be584; --bad:#ff7b7b;
  --pw:clamp(27rem,35vw,42rem);
  --accent-ink:#ffd84d; --hl:#ffd84d; --ring:#fff; --sea:#0a1017; --land:#2f4155; --bord:#70859b;
  --lbl:#d3deea; --lblhalo:#0a1017; --pinink:#0a1017; --neutral:#e8eef5; --glass:rgba(19,27,37,.92);
  --note:#b3c0cd; --allc:#fff; --plabel:#fff; --plabelhalo:#0a1017; --missfill:#0a1017;
}
html[data-theme=light]{
  --bg:#eef3f8; --bg2:#ffffff; --bg3:#f1f5f9; --line:#b9c6d4;
  --ink:#132030; --ink2:#3d5066; --accent:#ffd84d; --accent-ink:#8a5200; --hl:#c76a00;
  --ok:#12803a; --bad:#c62828; --ring:#1c2a3a; --sea:#d6e6f2; --land:#fbf9f3; --bord:#9aaabb;
  --lbl:#22344a; --lblhalo:#ffffff; --pinink:#101a26; --neutral:#ffffff; --glass:rgba(255,255,255,.94);
  --note:#4a5d73; --allc:#9fb4c8; --plabel:#101a26; --plabelhalo:#ffffff; --missfill:#ffffff;
}
html[data-theme=light] .chip,html[data-theme=light] .cbtn{border-color:color-mix(in srgb,var(--c) 60%,#1c2a3a)}
html[data-theme=light] .chip[aria-pressed=true],html[data-theme=light] .cbtn[aria-pressed=true]{border-color:#1c2a3a}
html[data-theme=light] .defbox b{color:var(--ink)}
html[data-theme=light] .pin.ok .num,html[data-theme=light] .pin.bad .num{fill:#fff}
html[data-theme=light] .brand small{color:var(--ink2)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{font-size:clamp(15px,.7vw + 8px,22px)}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Nanum Gothic",system-ui,sans-serif;
  line-height:1.5;overflow:hidden;
}
button{font:inherit;color:inherit}
#app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
header{display:flex;align-items:center;gap:1rem;padding:.55rem 1rem;background:var(--bg2);border-bottom:2px solid var(--line)}
.brand{font-size:1.3rem;font-weight:900;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-size:.72rem;font-weight:600;color:var(--ink2);letter-spacing:0}
nav{display:flex;gap:.5rem;margin-left:auto}
.tab.theme{font-weight:700;font-size:.9rem}
.tab{background:var(--bg3);border:2px solid var(--line);border-radius:.7rem;padding:.45rem 1.1rem;font-weight:800;cursor:pointer}
.tab:hover{border-color:var(--ink2)}
.tab[aria-selected=true]{background:var(--accent);color:#14181d;border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

main{display:grid;grid-template-columns:1fr var(--pw);min-height:0}
main.table #mapWrap,main.table #panel{display:none}
main.table{grid-template-columns:1fr}
#tableView{display:none;overflow:auto;padding:1rem 1.5rem}
main.table #tableView{display:block}

#mapWrap{position:relative;min-height:0;min-width:0;background:var(--sea)}
#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none}
#map.drag{cursor:grabbing}
.land{fill:var(--land)}
.borders{fill:none;stroke:var(--bord);stroke-width:.7;vector-effect:non-scaling-stroke}
.lbl{font-size:13px;font-weight:700;fill:var(--lbl);paint-order:stroke;stroke:var(--lblhalo);stroke-width:4px;stroke-linejoin:round;text-anchor:middle;pointer-events:none}
.pin{cursor:pointer}
.pin .main{fill:var(--c,#ddd);stroke:var(--ring);stroke-width:3;transition:fill .2s}
.pin .hit{fill:transparent}
.pin .halo{fill:none;stroke:var(--hl);stroke-width:4;opacity:0;transform-box:fill-box;transform-origin:center}
.pin .num{font-size:15px;font-weight:900;fill:var(--pinink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin .plabel{display:none;font-size:19px;font-weight:900;fill:var(--plabel);paint-order:stroke;stroke:var(--plabelhalo);stroke-width:6px;stroke-linejoin:round;pointer-events:none;dominant-baseline:central}
.pin.lab .plabel{display:block}
.pin.neutral .main{fill:var(--neutral);stroke:var(--pinink)}
.pin.sel .main{stroke:var(--hl);stroke-width:6}
.pin.ok .main{fill:var(--ok)}
.pin.bad .main{fill:var(--bad)}
.pin.miss .main{fill:var(--missfill);stroke:var(--hl);stroke-dasharray:5 4;stroke-width:3.5}
.pin.miss .num{fill:var(--hl)}
.pin.dim{opacity:.3}
.pin.target .halo{animation:pulse 1.6s ease-out infinite}
.pin.miss .halo{animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}
@media (prefers-reduced-motion:reduce){.pin.target .halo,.pin.miss .halo{animation:none;opacity:.8}}

.mapctl{position:absolute;left:.8rem;top:.8rem;display:flex;flex-wrap:wrap;gap:.4rem;max-width:calc(100% - 1.6rem)}
.mbtn{background:var(--glass);border:2px solid var(--line);border-radius:.6rem;padding:.3rem .75rem;cursor:pointer;font-weight:700;font-size:.9rem}
.mbtn:hover{border-color:var(--ink2)}
.zoomctl{position:absolute;right:.8rem;bottom:.8rem;display:flex;flex-direction:column;gap:.4rem}
.zoomctl .mbtn{width:2.6rem;height:2.6rem;font-size:1.3rem;padding:0;line-height:1}
.legend{position:absolute;left:.8rem;bottom:.8rem;background:var(--glass);border:2px solid var(--line);border-radius:.7rem;padding:.4rem .7rem;font-size:.85rem;display:flex;flex-wrap:wrap;gap:.2rem .9rem;max-width:min(34rem,70%)}
.legend span::before{content:"";display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--c);margin-right:.35em;vertical-align:-.05em}
.legend .note{flex-basis:100%;color:var(--note);font-size:.78rem}
.legend .note::before{display:none}

#panel{background:var(--bg2);border-left:2px solid var(--line);padding:1rem 1.1rem 1.4rem;overflow:auto;min-height:0}
.stitle{font-weight:800;color:var(--accent-ink);margin:.9rem 0 .4rem;font-size:.95rem}
.stitle:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{--c:#fff;display:inline-flex;align-items:center;gap:.3rem;padding:.12rem .65rem;border-radius:999px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);font-weight:800;font-size:.95rem;white-space:nowrap}
button.chip{cursor:pointer}
button.chip:hover{background:color-mix(in srgb,var(--c) 32%,transparent)}
button.chip[aria-pressed=true]{background:var(--c);color:#12161b}
.chip.dot::before{content:"";width:.7em;height:.7em;border-radius:50%;background:var(--c)}
.chip.dot[aria-pressed=true]::before{background:#12161b}
.chip.sm{font-size:.75rem;padding:0 .45rem}
.defbox{--c:#fff;margin-top:.6rem;padding:.6rem .8rem;border-radius:.7rem;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.defbox b{color:var(--c)}
.defbox .cnt{display:block;margin-top:.2rem;font-weight:700}
.hint-line{color:var(--ink2);font-size:.9rem;margin:.6rem 0 0}

.list{display:flex;flex-direction:column;gap:.45rem;margin-top:.5rem}
.row{display:flex;align-items:center;gap:.7rem;text-align:left;background:var(--bg3);border:2px solid var(--line);border-radius:.8rem;padding:.5rem .7rem;cursor:pointer;width:100%}
.row:hover{border-color:var(--ink2)}
.num{--c:#ddd;flex:none;width:2.1rem;height:2.1rem;border-radius:50%;background:var(--c);color:var(--pinink);font-weight:900;display:grid;place-items:center;border:2px solid var(--ring)}
.num.big{width:3rem;height:3rem;font-size:1.3rem}
.row .nm{flex:1;font-weight:800;line-height:1.25}
.row .nm small{display:block;font-weight:500;color:var(--ink2);font-size:.8rem}
.row .cs{display:flex;gap:.25rem;flex-wrap:wrap;justify-content:flex-end;max-width:11rem}
.empty{padding:1.2rem;color:var(--ink2);text-align:center;border:2px dashed var(--line);border-radius:.8rem;margin-top:.6rem}

.btn{background:var(--bg3);border:2px solid var(--line);border-radius:.7rem;padding:.45rem .9rem;cursor:pointer;font-weight:700}
.btn:hover:not(:disabled){border-color:var(--ink2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#14181d;font-weight:900}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.big{padding:.7rem 1.2rem;font-size:1.1rem}
.btn.ghost{background:transparent}
.bar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.bar .sp{margin-left:auto}

.dhead{display:flex;gap:.8rem;align-items:center;margin:.8rem 0 .6rem}
.dhead h2{margin:0;font-size:1.35rem;line-height:1.2}
.sub{color:var(--ink2);font-size:.9rem}
.sum{font-size:1.02rem;margin:.7rem 0}
.now{background:var(--bg3);border-left:5px solid var(--accent);padding:.5rem .8rem;border-radius:.4rem;margin:.6rem 0;font-size:.95rem}
ul.why{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.55rem}
ul.why li{display:flex;gap:.6rem;align-items:flex-start}
ul.why .chip{flex:none;margin-top:.1rem}


.lbl.sea{font-style:italic;font-weight:600;fill:#2f7fc4}
html[data-theme=dark] .lbl.sea{fill:#8cc4ff}
.sum{font-size:1.05rem}
.chips.big .chip{font-size:1.2rem;padding:.25rem 1rem}
.intro{color:var(--ink2);margin:.3rem 0 0}
.tab.theme{font-weight:700;font-size:.9rem}
header .theme{margin-left:auto}
.cause-name{margin:.1rem 0 .2rem}
@media (max-width:900px){
  main{grid-template-columns:1fr;grid-template-rows:55% 45%}
  #panel{border-left:0;border-top:2px solid var(--line)}
  .brand small{display:none}
}</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">🗺️ 세계 분쟁 지역 지도<small>번호 핀을 누르면 분쟁 이름과 주요 원인이 나와요</small></div>
    <button class="tab theme" id="themeBtn" data-act="theme" aria-label="화면 밝기 바꾸기">🌙 어둡게</button>
  </header>
  <main id="main">
    <section id="mapWrap" aria-label="세계 지도">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="분쟁 지역이 표시된 세계 지도">
        <path class="land" id="land"></path>
        <path class="borders" id="borders"></path>
        <g id="labels"></g>
        <g id="pins"></g>
      </svg>
      <div class="mapctl" id="mapctl"></div>
      <div class="zoomctl">
        <button class="mbtn" data-zoom="in" aria-label="확대">＋</button>
        <button class="mbtn" data-zoom="out" aria-label="축소">－</button>
      </div>
      <div class="legend" id="legend"></div>
    </section>
    <aside id="panel" aria-live="polite"></aside>
  </main>
</div>

 {k:'영토',i:'🗺️',c:'#7fd1ae',d:'땅·섬·바다의 주인(영유권)이 누구인지를 둘러싼 갈등'},
 {k:'국경',i:'🚧',c:'#6ab7ff',d:'나라 사이의 경계선을 어디에 그을지 다투는 갈등'},
 {k:'자원',i:'🛢️',c:'#ffa94d',d:'석유·가스·광물·어장 같은 자원을 차지하려는 갈등'},
 {k:'문화',i:'🎭',c:'#ff9ed8',d:'고유한 언어·전통을 지키려는 갈등'}
];
const REGIONS=[
 {k:'유럽',c:'#5aa9ff'},{k:'서아시아',c:'#ffb454'},{k:'아프리카',c:'#6fd98a'},{k:'아시아',c:'#ff7a90'},{k:'남아메리카',c:'#c79bff'}
];
const DATA=[
{id:1,short:'바스크',name:'에스파냐–바스크 분리주의 운동',region:'유럽',sub:'에스파냐 북부 · 프랑스 남서부',causes:['민족','문화'],
 summary:'에스파냐 안의 바스크 민족이 자치를 요구하며 분리주의 운동을 벌여 왔어요.',
 why:{민족:'바스크인은 에스파냐인과 다른 독자적인 민족이라는 정체성을 가지고 있어요.',문화:'다른 유럽 언어와 계통이 다른 바스크어와 고유한 전통을 지키려 해요.'}},
{id:2,short:'이스라엘–팔레스타인',name:'이스라엘–팔레스타인 분쟁',region:'서아시아',sub:'지중해 동쪽 해안',causes:['영토','민족','종교'],
 summary:'팔레스타인 지역을 둘러싸고 이스라엘과 팔레스타인이 분쟁하고 있어요.',
 why:{영토:'같은 땅(요르단강 서안, 가자 지구 등)을 서로 자기 땅이라고 주장해요.',민족:'유대인과 팔레스타인 아랍인이 각각 자신들의 나라를 원해요.',종교:'예루살렘은 유대교·크리스트교·이슬람교 모두의 성지예요.'}},
{id:3,short:'서사하라',name:'서사하라 분쟁',region:'아프리카',sub:'아프리카 북서부 · 대서양 연안',causes:['영토','민족','자원'],
 summary:'서사하라 지역을 두고 모로코는 영유권을, 현지인은 독립을 주장하며 대립하고 있어요.',
 why:{영토:'모로코는 자기 영토라 하고, 현지인 세력은 독립 국가를 세우려 해요.',민족:'현지의 사하라위인이 모로코와는 다른 민족 정체성을 내세워요.',자원:'비료 원료인 인광석과 대서양 어장 등 자원이 풍부해요.'}},
{id:4,short:'중국–인도',name:'중국–인도 분쟁',region:'아시아',sub:'히말라야 산지',causes:['국경','영토'],
 summary:'중국과 인도의 영토가 맞닿은 지역에서 두 나라가 서로 다른 국경을 주장하며 대립하고 있어요.',
 why:{국경:'두 나라 사이에 합의된 국경선이 없어 서로 다른 선을 주장해요.',영토:'서쪽의 악사이친, 동쪽의 아루나찰프라데시 지역을 서로 자기 땅이라고 해요.'}},
{id:5,short:'남쿠릴 열도',name:'남쿠릴 열도(북방 영토) 분쟁',region:'아시아',sub:'일본 홋카이도 북동쪽 바다',causes:['영토','국경','자원'],
 summary:'러시아와 일본이 남쿠릴 열도의 섬들에 대한 영유권을 주장하며 대립하고 있어요.',
 why:{영토:'러시아가 실제로 다스리지만 일본은 \'북방 영토\'라며 돌려 달라고 해요.',국경:'두 나라 사이 바다의 경계가 확정되지 않았어요.',자원:'주변 바다가 풍부한 어장이에요.'}},
{id:6,short:'포클랜드',name:'포클랜드 분쟁',region:'남아메리카',sub:'남대서양 · 아르헨티나 앞바다',causes:['영토','자원'],
 summary:'남대서양의 포클랜드(말비나스) 제도를 두고 아르헨티나와 영국이 영유권을 주장하며 대립하고 있어요.',
 why:{영토:'영국은 실제 지배를, 아르헨티나는 가까운 거리와 역사적 권리를 내세워요. 1982년에는 전쟁도 있었어요.',자원:'주변 바다의 어업 자원과 석유 개발 가능성이 있어요.'}}
];

/* ---------- 유틸 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>DATA.find(d=>d.id===id);
const cz=k=>CAUSES.find(c=>c.k===k);
const rcolor=k=>REGIONS.find(r=>r.k===k).c;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const chip=(k,cls='')=>`<span class="chip ${cls}" style="--c:${cz(k).c}">${cz(k).i} ${k}</span>`;
const sameSet=(a,b)=>a.size===b.size&&[...a].every(x=>b.has(x));

/* ---------- 지도 ---------- */
const NS='http://www.w3.org/2000/svg';
const svg=$('#map'), mapWrap=$('#mapWrap');
$('#land').setAttribute('d',MAP.land);
$('#borders').setAttribute('d',MAP.borders);
const WORLD=MAP.regions.world;
let W=1000,H=600;
let view={cx:WORLD.x+WORLD.w/2,cy:WORLD.y+WORLD.h/2,w:WORLD.w*1.03};
let anim=null;
const pinEls={}, lblEls=[];
const gLabels=$('#labels'), gPins=$('#pins');

MAP.labels.forEach(l=>{
  const g=document.createElementNS(NS,'g'); g.dataset.x=l.x; g.dataset.y=l.y;
  const t=document.createElementNS(NS,'text'); t.setAttribute('class','lbl'+(l.s?' sea':'')); t.textContent=l.n;
  g.appendChild(t); gLabels.appendChild(g); lblEls.push({g,t:l.t,x:l.x,y:l.y});
});
DATA.forEach(d=>{
  const [x,y]=MAP.pins[d.id];
  const g=document.createElementNS(NS,'g'); g.setAttribute('class','pin'); g.dataset.id=d.id;
  g.innerHTML='<g class="in"><circle class="halo" r="15"></circle><circle class="main" r="15"></circle><text class="num" y="1"></text><text class="plabel" x="24"></text><circle class="hit" r="26"></circle></g>';
  g.querySelector('.plabel').textContent=d.short;
  gPins.appendChild(g); pinEls[d.id]={g,x,y,num:g.querySelector('.num'),lab:g.querySelector('.plabel')};
});

function fitView(region,pad=1.1){
  const r=MAP.regions[region], asp=W/H;
  return {cx:r.x+r.w/2,cy:r.y+r.h/2,w:Math.max(r.w*pad,r.h*pad*asp)};
}
function applyView(){
  view.cx=Math.min(1000,Math.max(0,view.cx)); view.cy=Math.min(500,Math.max(0,view.cy));
  const h=view.w*H/W, x0=view.cx-view.w/2, y0=view.cy-h/2, s=W/view.w;
  svg.setAttribute('viewBox',`${x0} ${y0} ${view.w} ${h}`);
  const z=WORLD.w/view.w, k=1/s;
  const lim=[0.85,1.6,3,8];
  const pts=Object.values(pinEls).map(p=>[(p.x-x0)*s,(p.y-y0)*s]);
  lblEls.forEach(o=>{
    let show=z>=lim[o.t-1];
    if(show){const lx=(o.x-x0)*s, ly=(o.y-y0)*s;
      if(pts.some(q=>Math.abs(q[0]-lx)<62&&Math.abs(q[1]-ly)<26))show=false;}
    o.g.style.display=show?'':'none';
    if(show) o.g.setAttribute('transform',`translate(${o.x} ${o.y}) scale(${k})`);
  });
  Object.values(pinEls).forEach(p=>{
    p.g.setAttribute('transform',`translate(${p.x} ${p.y}) scale(${k})`);
    const sx=(p.x-x0)*s;
    if(sx>W-230){p.lab.setAttribute('x',-24);p.lab.style.textAnchor='end';} else {p.lab.setAttribute('x',24);p.lab.style.textAnchor='start';}
  });
}
function measure(){const r=mapWrap.getBoundingClientRect();W=Math.max(100,r.width);H=Math.max(100,r.height);}
function animateTo(t,ms=650){
  if(anim)cancelAnimationFrame(anim);
  const a={...view}, t0=performance.now();
  const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
  const step=now=>{
    const u=Math.min(1,(now-t0)/ms), e=ease(u);
    view.cx=a.cx+(t.cx-a.cx)*e; view.cy=a.cy+(t.cy-a.cy)*e;
    view.w=Math.exp(Math.log(a.w)+(Math.log(t.w)-Math.log(a.w))*e);
    applyView();
    anim=u<1?requestAnimationFrame(step):null;
  };
  anim=requestAnimationFrame(step);
}
function goRegion(k){animateTo(k==='all'||k==='world'?fitView('world',1.03):fitView(k));}
function fitPins(ids,minW=140){
  const xs=ids.map(i=>pinEls[i].x), ys=ids.map(i=>pinEls[i].y), asp=W/H;
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  animateTo({cx:(x0+x1)/2,cy:(y0+y1)/2,w:Math.max((x1-x0)*1.5,(y1-y0)*1.5*asp,minW,asp*40)});
}
function focusPin(id,w=110){const p=pinEls[id];animateTo({cx:p.x,cy:p.y,w:Math.max(w,W/H*40)});}
function zoomBy(f,px=W/2,py=H/2){
  const h=view.w*H/W, x0=view.cx-view.w/2, y0=view.cy-h/2;
  const mx=x0+px/W*view.w, my=y0+py/H*h;
  const nw=Math.min(WORLD.w*1.2,Math.max(WORLD.w/40,view.w*f));
  const r=nw/view.w;
  view.cx=mx-(mx-view.cx)*r; view.cy=my-(my-view.cy)*r; view.w=nw; applyView();
}
let drag=null, suppress=false;
svg.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  if(anim){cancelAnimationFrame(anim);anim=null;}
  drag={x:e.clientX,y:e.clientY,cx:view.cx,cy:view.cy,moved:false};
});
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!drag.moved&&Math.hypot(dx,dy)>5){drag.moved=true;svg.classList.add('drag');}
  if(drag.moved){const s=W/view.w;view.cx=drag.cx-dx/s;view.cy=drag.cy-dy/s;applyView();}
});
window.addEventListener('pointerup',()=>{
  if(drag){suppress=drag.moved;setTimeout(()=>{suppress=false;},0);}
  drag=null;svg.classList.remove('drag');
});
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=svg.getBoundingClientRect();
  zoomBy(e.deltaY<0?0.8:1.25,e.clientX-r.left,e.clientY-r.top);
},{passive:false});
svg.addEventListener('click',e=>{
  if(suppress)return;
  const p=e.target.closest('.pin');
  if(p)onPinClick(+p.dataset.id);
});
new ResizeObserver(()=>{measure();applyView();}).observe(mapWrap);

/* 핀 상태 */
function setPin(id,{cls='',glyph='',label=false}={}){
  const p=pinEls[id], d=byId(id);
  p.g.setAttribute('class','pin '+cls+(label?' lab':''));
  p.g.style.setProperty('--c',rcolor(d.region));
  p.num.textContent=glyph;
}



/* ---------- 학습 자료 ---------- */
let sel=null;
const panel=$('#panel');
function renderMapCtl(){
  const items=[['all','🌐 세계'],['유럽·아프리카','유럽·서아시아·아프리카'],['아시아','아시아'],['아메리카','남아메리카']];
  $('#mapctl').innerHTML=items.map(([k,l])=>`<button class="mbtn" data-act="goreg" data-v="${k}">${l}</button>`).join('');
}
function renderLegend(){
  $('#legend').innerHTML=REGIONS.map(r=>`<span style="--c:${r.c}">${r.k}</span>`).join('')+`<span class="note">※ 학습용으로 단순화한 지도예요. 국경선은 참고용입니다.</span>`;
}
function syncPins(){
  DATA.forEach(d=>setPin(d.id,{cls:sel===d.id?'sel':'',glyph:String(d.id),label:sel===d.id}));
}
function renderPanel(){
  let h='';
  if(sel==null){
    h+=`<div class="stitle">📍 지도의 번호 핀을 눌러 보세요</div><p class="intro">분쟁 이름과 주요 원인이 나와요. 아래 목록에서 골라도 돼요.</p>`;
    h+=`<div class="stitle">분쟁 목록 (${DATA.length})</div><div class="list">`+DATA.map(d=>`<button class="row" data-act="open" data-id="${d.id}"><span class="num" style="--c:${rcolor(d.region)}">${d.id}</span><span class="nm">${d.name}<small>${d.region} · ${d.sub}</small></span></button>`).join('')+`</div>`;
  } else {
    const d=byId(sel);
    h+=`<div class="bar"><button class="btn" data-act="back">◀ 목록</button><span class="sp"></span><button class="btn" data-act="prev">◀ 이전</button><button class="btn" data-act="next">다음 ▶</button></div>`;
    h+=`<div class="dhead"><span class="num big" style="--c:${rcolor(d.region)}">${d.id}</span><div><h2>${d.name}</h2><div class="sub">📍 ${d.region} · ${d.sub}</div></div></div>`;
    h+=`<p class="sum">${d.summary}</p>`;
    h+=`<div class="stitle">주요 원인</div><div class="chips big">${d.causes.map(k=>chip(k)).join('')}</div>`;
    h+=`<div class="stitle" style="margin-top:1.1rem">왜 그럴까요?</div><ul class="why">${d.causes.map(k=>`<li>${chip(k)}<span>${d.why[k]}</span></li>`).join('')}</ul>`;
  }
  panel.innerHTML=h;
}
function select(id){sel=id;renderPanel();syncPins();panel.scrollTop=0;focusPin(id,120);}
function clearSel(){sel=null;renderPanel();syncPins();panel.scrollTop=0;goRegion('all');}
function step(dir){const i=DATA.findIndex(d=>d.id===sel);select(DATA[(i+dir+DATA.length)%DATA.length].id);}
function onPinClick(id){select(id);}
function setTheme(m){
  document.documentElement.dataset.theme=m;
  const b=$('#themeBtn');if(b)b.textContent=m==='light'?'🌙 어둡게':'☀️ 밝게';
}
document.addEventListener('click',e=>{
  const z=e.target.closest('[data-zoom]');if(z){zoomBy(z.dataset.zoom==='in'?.6:1.6);return;}
  const a=e.target.closest('[data-act]');if(!a)return;
  switch(a.dataset.act){
    case 'goreg':goRegion(a.dataset.v);break;
    case 'open':select(+a.dataset.id);break;
    case 'back':clearSel();break;
    case 'prev':step(-1);break;
    case 'next':step(1);break;
    case 'theme':setTheme(document.documentElement.dataset.theme==='light'?'dark':'light');break;
  }
});
document.addEventListener('keydown',e=>{
  if(sel==null)return;
  if(e.key==='ArrowRight')step(1);
  else if(e.key==='ArrowLeft')step(-1);
  else if(e.key==='Escape')clearSel();
});
setTheme('light');
measure();
view=fitView('world',1.03);
applyView();
renderMapCtl();renderLegend();renderPanel();syncPins();
requestAnimationFrame(()=>{measure();view=fitView('world',1.03);applyView();});

</script>
</body>
</html>
